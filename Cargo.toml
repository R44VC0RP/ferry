[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
description = "Send files and run commands between your own machines over a tailnet"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gethostname = "1"
getrandom = "0.3"
hmac = "0.12"
if-addrs = "0.13"
ignore = "0.4"
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = false
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
